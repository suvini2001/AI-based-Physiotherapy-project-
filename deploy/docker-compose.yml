# Person B, Week 1 — api + db + caddy.
# Run from repo root:  docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: physio
    volumes: [ "db_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql+psycopg://physio:${DB_PASSWORD}@db:5432/physio
      SECRET_KEY: ${SECRET_KEY}
      PATIENT_JWT_SECRET: ${PATIENT_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: /data/uploads
    volumes: [ "upload_data:/data/uploads" ]
    depends_on:
      db: { condition: service_healthy }
    expose: [ "8000" ]

  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on: [ api ]

volumes: { db_data: {}, upload_data: {}, caddy_data: {}, caddy_config: {} }

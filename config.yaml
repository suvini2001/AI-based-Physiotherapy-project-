# Shared settings for the cleaning pipeline.
# Change a value here and every script picks it up.

visibility_threshold: 0.70   # drop landmarks with visibility below this (step 1.4)
filter_cutoff_hz: 6          # smoothing filter cut-off in Hz (step 1.5)
max_gap_frames: 5            # longest gap A's gap-filling will repair (step 1.6)

# B1 / B6 – view check and yaw gate
view_check:
  warn_deg: 30.0             # amber warning when body yaw exceeds this
  block_deg: 50.0            # red warning; gate rejects most frames above this

# B4 / B6 – bone-length gate
bone_gate:
  jump_frac: 0.40            # reject frame if bone length jumps > 40 % from median
  min_frac:  0.05            # reject frame if bone shorter than 5 % of median

# A7 – calibration screen
calibration:
  countdown_seconds: 10.0
  hold_seconds: 3.0
  expected_straight_deg: 175.0
  straight_tolerance_deg: 15.0
  curve_file: data/population_curve.json
  out_file: data/user_calibration.json

# Angle method used by demo_cv.py (Phase 4A decision, see 04b_expanding_compare.ipynb)
angle:
  method: ML                                          # ML = learned I_ML angle; A = 2D angle + curve
  iml_model: data/iml_nolook_rehab24_exp_torso.txt   # expanding session stats, torso-length scale
  fallback_calibration: data/user_calibration.json   # curve used for the first ~1 s and when features are missing

# Shoulder angle used by demo_cv.py --exercise shoulder (S02_shoulder_compare_train.ipynb)
# I_ML for front AND side views (E3 median error: front 5.6 deg, side 9.1 deg).
# The pre-registered rule picked the curve for the front view; I_ML is used for all
# views so the shoulder works like the elbow (one model, side-on allowed).
shoulder_angle:
  method: ML                                                # ML = shoulder I_ML; A = raw 2D hip-shoulder-elbow angle
  iml_model: data/iml_shoulder_rehab24.txt                  # trained on REHAB24-6 only (licence)
  fallback_calibration: data/population_curve_shoulder_front.json   # first ~1 s and frames without features
